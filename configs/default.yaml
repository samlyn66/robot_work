# 肌腱吻合分层模仿 VAM 默认配置
# 与《面向肌腱吻合的分层模仿视频-动作模型》技术方案及 SRT-H 论文对齐

# ---- ADS 原始数据（recording_xxx/ads_data.csv，无表头，367 列）----
# 列映射由 scripts/inspect_ads.py 自动分析得出（在 recording_20260826_172240 上验证）：
#   - 4 组连续四元数块属于左/主臂（cols 12-39），其中 cols 12-18 (pos3+quat4) 运动幅度最大
#     且四元数无符号翻转 → 主臂末端实测位姿
#   - cols 167-173 (pos3+quat4) 是另一条大幅运动流 → 副臂末端位姿
#   - cols 43 / 133 分别为两臂夹爪开合候选列（连续值，缝合过程有 ~28/22 次大开合）
# 左右臂与视频画面的对应关系请用 inspect_ads.py 的逐帧回放核对后，必要时交换 arm0/arm1。
ads:
  csv_name: ads_data.csv
  # 视频文件名匹配模式（实际文件带时间戳后缀，如 left_endo_20260826_172246_H.264.mp4）
  left_video_glob: "*left_endo*.mp4"
  right_video_glob: "*right_endo*.mp4"
  video_fps: 60                    # 原始视频帧率（H.264 1920x1080）
  quat_order: wxyz                 # 四元数分量顺序
  arm0:                            # 主臂（疑似左臂，块 A1）
    pos_cols: [12, 13, 14]
    quat_cols: [15, 16, 17, 18]
    gripper_col: 43
  arm1:                            # 副臂（疑似右臂，块 C2）
    pos_cols: [167, 168, 169]
    quat_cols: [170, 171, 172, 173]
    gripper_col: 133
  # CSV 无时间戳列：按「CSV 行数 / 视频帧数」比例对齐（两者同时起录，误差 <1%）
  align: frame_ratio
  out_rate: 30                     # kinematics.csv 输出采样率 (Hz)
  fix_quat_sign: true              # 消除四元数双覆盖符号跳变，保证 6D 连续

data:
  root: data                      # 数据根目录（recording_xxx/{ads_data.csv,left_endo*.mp4,right_endo*.mp4}）
  frame_rate: 10                  # 抽帧目标帧率 (Hz)，LL 控制频率
  hl_history: 4                   # HL 观测历史帧数（SRT-H: k=4）
  hl_history_stride_sec: 1.0      # HL 历史帧间隔（SRT-H: 1 s）
  hl_frame_size: 224
  ll_frame_size: 224
  val_recordings: []              # 留出录像名列表；为空时自动按 80/20 划分
  seed: 42

task:
  # 6 个缝合阶段 + idle（技术方案：持针/进针/出针/拉线/打结/剪线）
  phases: [idle, grasp_needle, insert, exit, pull, knot, cut]
  # SRT-H 式纠正指令（18 类方向动作，双臂）
  corrections:
    - close_left_gripper
    - close_right_gripper
    - open_left_gripper
    - open_right_gripper
    - move_left_left
    - move_left_right
    - move_left_towards
    - move_left_away
    - move_left_up
    - move_left_down
    - move_right_left
    - move_right_right
    - move_right_towards
    - move_right_away
    - move_right_up
    - move_right_down
    - close_both_grippers
    - open_both_grippers

action:
  dim_per_arm: 10                 # 平移3 + 6D旋转6 + 夹爪1（hybrid-relative, SRT 论文）
  num_arms: 2
  chunk: 20                       # 动作分块长度：10Hz x 2s（SRT-H: k=60@30Hz）
  use_6d_rotation: true

hl:
  dim: 384
  depth: 6
  heads: 8
  center_crop: [0.5, 0.8]         # 中心裁剪：宽度内 50%，高度下 80%（SRT-H）
  l1_loss_weight: 0.4             # 任务 CE × L1 类距（SRT-H Eq.1）
  flag_loss_weight: 0.3
  corr_loss_weight: 0.3
  predict_offset_sec: 0.5         # 预测 0.5s 未来的子任务（SRT-H 训练技巧）
  dropout: 0.1

ll:
  backbone: efficientnet_b3       # SRT-H LL 视觉编码器
  dim: 512
  depth: 6
  heads: 8
  cam_dropout: 0.07               # 随机丢弃一路相机输入（SRT-H）
  fiLM: true                      # FiLM 语言调制

vam:
  video_backbone: efficientnet_b0 # 共享视觉编码器（可换 VideoMAE/V-JEPA）
  latent_dim: 256
  partial_denoise_t: 0.6          # 局部去噪：只积分到中间流时间 s=t（<1 即中止）
  flow_steps: 10                  # 推理 Euler 积步步数
  align_heads: 4                  # 显式时空对齐 cross-attention
  align_layers: 2
  ema: 0.999

train:
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.05
  epochs_hl: 60
  epochs_ll: 300
  epochs_vam: 300
  warmup_epochs: 3
  amp: true
  num_workers: 4
  out_dir: runs
